name: Config Webhook

on:
  push:
    branches: ["main"]          # change to ["**"] if you want any branch
    paths:
      - "Config.yaml"
      - "config.yaml"
  workflow_dispatch:
    inputs:
      file_path:
        description: "Path to YAML to include (optional)"
        required: false
        default: ""
      note:
        description: "Optional note included in payload"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python (so pip works)
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install jq & PyYAML
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Choose config file and URL
        id: cfg
        shell: bash
        run: |
          echo "webhook_url=https://webhook.site/d9a7bfe4-7b21-41f3-8dc3-fbc8788a3cb8" >> "$GITHUB_OUTPUT"

          # Prefer manual input (workflow_dispatch), otherwise pick existing file
          FILE="${{ inputs.file_path }}"
          if [ -z "$FILE" ]; then
            if   [ -f "Config.yaml" ]; then FILE="Config.yaml"
            elif [ -f "config.yaml" ]; then FILE="config.yaml"
            else echo "No config file found (Config.yaml/config.yaml)"; exit 1
            fi
          fi
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "Using file: $FILE"

      - name: Validate YAML parses
        shell: bash
        run: |
          python - <<'PY'
          import yaml, pathlib, sys
          p = pathlib.Path("${{ steps.cfg.outputs.file }}")
          with p.open("r", encoding="utf-8") as f:
              yaml.safe_load(f)
          print("YAML OK")
          PY

      - name: Build JSON payload
        shell: bash
        run: |
          FILE="${{ steps.cfg.outputs.file }}"
          NOTE="${{ inputs.note }}"
          jq -n \
            --arg event  "${{ github.event_name }}" \
            --arg repo   "${{ github.repository }}" \
            --arg actor  "${{ github.actor }}" \
            --arg ref    "${{ github.ref_name }}" \
            --arg sha    "${{ github.sha }}" \
            --arg note   "$NOTE" \
            '{event:$event, repo:$repo, actor:$actor, ref:$ref, sha:$sha, note:$note}' > payload.json

          # Attach the YAML file contents as a raw string
          jq -Rs --argfile base payload.json \
            '. as $cfg | $base + {data: .}' "$FILE" > payload.withcfg.json
          mv payload.withcfg.json payload.json

          echo "Payload preview:"
          cat payload.json

      - name: POST to webhook.site
        shell: bash
        run: |
          URL="${{ steps.cfg.outputs.webhook_url }}"
          CODE=$(curl -sS -o resp.txt -w "%{http_code}" -X POST "$URL" \
            -H "Content-Type: application/json" \
            --data @payload.json)
          echo "HTTP $CODE"
          echo "Response:"; cat resp.txt
          test "$CODE" -ge 200 -a "$CODE" -lt 400
