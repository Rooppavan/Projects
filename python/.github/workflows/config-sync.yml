name: Config Webhook

on:
  push:                     # auto-run on push
    branches: ["main"]
    paths:
      - "Config.yaml"
      - "config.yaml"
  workflow_dispatch:        # manual Run workflow button
    inputs:
      file_path:
        description: "Path to YAML to include (optional)"
        required: false
        default: ""
      note:
        description: "Optional note to include in payload"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set config file & webhook URL (no secrets)
        id: cfg
        shell: bash
        run: |
          # 🔗 Hard-coded webhook URL (no secrets)
          echo "webhook_url=https://webhook.site/d9a7bfe4-7b21-41f3-8dc3-fbc8788a3cb8" >> "$GITHUB_OUTPUT"

          # Pick file: input > Config.yaml > config.yaml
          INPUT="${{ github.event.inputs.file_path }}"
          if [ -n "$INPUT" ]; then
            FILE="$INPUT"
          elif [ -f "Config.yaml" ]; then
            FILE="Config.yaml"
          elif [ -f "config.yaml" ]; then
            FILE="config.yaml"
          else
            echo "No config file found (tried Config.yaml, config.yaml)"; exit 1
          fi
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "Using file: $FILE"

      - name: Install PyYAML & jq
        run: |
          pip install pyyaml
          sudo apt-get update -y
          sudo apt-get install -y jq

      - name: Validate YAML
        shell: bash
        run: |
          FILE="${{ steps.cfg.outputs.file }}"
          python - <<PY
import sys, yaml, pathlib
p = pathlib.Path("${{ steps.cfg.outputs.file }}")
with p.open("r", encoding="utf-8") as f:
    yaml.safe_load(f)
print("YAML OK")
PY

      - name: Build JSON payload
        shell: bash
        run: |
          FILE="${{ steps.cfg.outputs.file }}"
          NOTE="${{ github.event.inputs.note || '' }}"
          # Base payload
          jq -n \
            --arg event  "${{ github.event_name }}" \
            --arg repo   "${{ github.repository }}" \
            --arg actor  "${{ github.actor }}" \
            --arg ref    "${{ github.ref_name }}" \
            --arg sha    "${{ github.sha }}" \
            --arg note   "$NOTE" \
            '{event:$event, repo:$repo, actor:$actor, ref:$ref, sha:$sha, note:$note}' > payload.json

          # Attach YAML file content as a raw string
          jq -Rs --argfile base payload.json \
            '. as $cfg | $base + {config_yaml: .}' "$FILE" > payload.withcfg.json
          mv payload.withcfg.json payload.json
          echo "Payload built:" && cat payload.json

      - name: POST to webhook.site (no secrets)
        shell: bash
        run: |
          URL="${{ steps.cfg.outputs.webhook_url }}"
          CODE=$(curl -sS -o resp.txt -w "%{http_code}" -X POST "$URL" \
            -H "Content-Type: application/json" \
            --data @payload.json)
          echo "HTTP $CODE"
          echo "Response:"; cat resp.txt
          test "$CODE" -ge 200 -a "$CODE" -lt 400
